<!DOCTYPE html>
<html lang='ru'>
<head>
    <meta charset='UTF-8'>
    <title>Магазин</title>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
</head>
<body>
<nav class='navbar navbar-dark bg-dark p-3 mb-4'>
    <div class='container d-flex justify-content-between'>
        <a href='/' class='navbar-brand'>Мой Магазин</a>
        <div class='d-flex align-items-center'>
            <form method='post' action='{% url "set_city" %}' class='me-3'>
                {% csrf_token %}
                <input type='hidden' name='next' value='{{ request.path }}'>
                <select name='city' class='form-select form-select-sm' onchange='this.form.submit()'>
                    {% for c in cities %}
                    <option {% if current_city == c %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                </select>
            </form>
            <a href='/cart/' class='btn btn-outline-light'>Корзина ({{ cart_count }})</a>
        </div>
    </div>
</nav>
<div class='container'>
    {% block content %}{% endblock %}
</div>
{% if not request.COOKIES.city %}
<div class='modal show d-block' style='background:rgba(0,0,0,0.5)'>
    <div class='modal-dialog'>
        <form method='post' action='{% url "set_city" %}' class='modal-content'>
            {% csrf_token %}
            <input type='hidden' name='next' value='{{ request.path }}'>
            <div class='modal-header'><h5 class='modal-title'>Выберите город</h5></div>
            <div class='modal-body'>
                <select name='city' class='form-select'>
                    {% for c in cities %}<option>{{ c }}</option>{% endfor %}
                </select>
            </div>
            <div class='modal-footer'><button type='submit' class='btn btn-primary'>Сохранить</button></div>
        </form>
    </div>
</div>
{% endif %}
<script>
function getCookie(name) { let v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)'); return v ? v[2] : null; }
document.addEventListener('click', e => {
    if(e.target.classList.contains('btn-add')) {
        let id = e.target.dataset.id;
        fetch('/cart/add/' + id + '/', {method: 'POST', headers: {'X-CSRFToken': getCookie('csrftoken')}})
        .then(r=>r.json()).then(d=>{
            document.querySelectorAll('.cart-badge').forEach(el=>el.textContent = d.count);
            document.querySelector('.btn-outline-light').innerHTML = 'Корзина (' + d.count + ')';
        });
    }
});
</script>
</body>
</html>
